appId: com.lonepeakpsychiatry.compliancehub
productName: Compliance Hub
copyright: © Lone Peak Psychiatry

directories:
  output: dist
  buildResources: build

# Only the shell files ship inside the app; the UI is loaded from the hosted URL.
files:
  - main.js
  - package.json

# Notarize via our afterSign hook (keychain-profile), not electron-builder's
# built-in path, so the app-specific password stays in the user's Keychain.
afterSign: notarize.js

mac:
  category: public.app-category.medical
  target:
    - dmg
  icon: build/icon.png
  # Hardened runtime is required for notarization; harmless for unsigned local builds.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  # Emergency Alert records incident audio from the device that calls a code
  # and uses location to tell an on-site alert from a remote one. macOS blocks
  # both (silently) without these usage strings, and the hardened runtime also
  # needs the audio-input entitlement once the app is signed.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Compliance Hub records audio during an emergency you call, so admins can review the incident. Recordings are kept only on admin devices."
    NSLocationWhenInUseUsageDescription: "Compliance Hub uses your location when you call or respond to an emergency, to tell whether you're at the clinic."

dmg:
  title: Compliance Hub

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

# Auto-update source. Signed installers published here by CI can auto-update.
publish:
  provider: github
  owner: landonmoyers-svg
  repo: compliance-hub
